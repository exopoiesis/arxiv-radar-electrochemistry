name: Run arxiv-radar daily

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

env:
  GITHUB_USER_NAME: exopoiesis
  GITHUB_USER_EMAIL: lab@exopoiesis.space

permissions:
  contents: write

jobs:
  update:
    name: update corpus and pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily arxiv update
        run: python tools/daily_arxiv.py

      - name: Commit generated update
        run: |
          git config user.name "${{ env.GITHUB_USER_NAME }}"
          git config user.email "${{ env.GITHUB_USER_EMAIL }}"
          git add README.md data/ abstracts/ docs/abstracts/ docs/_data/ docs/index.md docs/tag/
          git diff --cached --quiet || git commit -m "GitHub Action automatic update: arxiv-radar-electrochemistry"
          git pull --rebase origin main
          git push
