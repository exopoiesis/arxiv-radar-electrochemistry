# arxiv-radar-electrochemistry configuration.
#
# Curated arXiv radar covering electrochemistry, mineral / sulfide surface
# chemistry, geochemistry, aqueous interfaces, and prebiotic mineral
# catalysis. Originally narrow-electrochemistry; expanded 2026-05-08 to
# absorb the (now-deprecated) arxiv-radar-sulfide-materials feed and
# add geochemistry + aqueous chem-physics coverage.
#
# Queries are narrow enough to avoid generic battery / generic-chemistry
# noise — RAW: AND-conditions are used wherever a greedy keyword could
# pull non-relevant ML/chem papers.

project:
  name: arxiv-radar-electrochemistry
  title: Electrochemistry & Mineral Surfaces arXiv Radar
  description: Curated arXiv papers on electrochemistry, sulfide / mineral surfaces, geochemistry, aqueous interfaces, ion transport, and prebiotic mineral catalysis.
  github_owner: exopoiesis
  github_repo: arxiv-radar-electrochemistry
  pages_url: https://exopoiesis.github.io/arxiv-radar-electrochemistry/

relevance_filter:
  enabled: true
  direct_patterns:
    # Original electrochem core
    - CO2\s+electroreduction
    - carbon\s+dioxide\s+reduction
    - CO2RR
    - formate\s+electrocatal
    - transition\s+metal\s+sulfide
    - iron\s+sulfide
    - nickel\s+sulfide
    - mackinawite
    - pentlandite
    - greigite
    - violarite
    - electrochemical\s+interface
    - electric\s+double\s+layer
    - pH\s+gradient
    - electrochemical\s+membrane
    - redox\s+network
    # Extended 2026-05-08 — minerals (merged from sulfide-materials)
    - pyrrhotite
    - millerite
    - marcasite
    - chalcopyrite
    - Fe[-\s]?Ni[-\s]?S
    - chalcogenide\s+surface
    - mineral\s+surface\w*
    # Extended 2026-05-08 — geochemistry
    - hydrothermal\s+vent
    - hydrothermal\s+alteration
    - alkaline\s+vent
    - serpentinization
    - serpentinisation
    - ore\s+deposit
    - mineral[-\s]?water\s+interface
    - silicate\s+weathering
    # Extended 2026-05-08 — prebiotic / origin-of-life
    - prebiotic\s+chemistry
    - origin\s+of\s+life
    - origins\s+of\s+life
    - mineral\s+catalysis
    - "\\[4Fe-4S\\]"
    - "\\[2Fe-2S\\]"
    - FeMoco
    - Wood-Ljungdahl
    - reductive\s+acetyl-CoA
    - rTCA
    - reverse\s+TCA
    # Extended 2026-05-08 — aqueous chem-physics interface
    - solvation\s+free\s+energy
    - hydration\s+free\s+energy
    - electrolyte\s+structure
    - polarizable\s+water
  method_patterns:
    - electrochem\w*
    - electrocatal\w*
    - electrode\w*
    - catalyst\w*
    - density\s+functional\s+theory
    - \bDFT\b
    - DFT\+U
    - ab\s+initio
    - molecular\s+dynamics
    - \bAIMD\b
    - microkinetic\w*
    - impedance
    - EIS
    - flow\s+cell\w*
    - membrane\s+reactor\w*
    # Extended 2026-05-08 — atomistic methods
    - nudged\s+elastic\s+band
    - \bNEB\b
    - machine\s+learning\s+potential\w*
    - interatomic\s+potential\w*
    - \bMLIP\b
    - \bMACE\b
    - CHGNet
    - M3GNet
    - active\s+learning
  domain_patterns:
    - CO2
    - carbon\s+dioxide
    - formate
    - hydrogen\s+evolution
    - oxygen\s+evolution
    - \bHER\b
    - \bOER\b
    - sulfide\w*
    - chalcogenide\w*
    - Fe[-\s]?Ni[-\s]?S
    - proton\s+transport
    - proton\s+diffusion
    - hydroxide\s+transport
    - pH\s+gradient
    - redox\s+cycle
    # Extended 2026-05-08
    - mineral\w*
    - hydrothermal\w*
    - prebiotic\w*
    - geochemistry
    - geochemical
    - origin\s+of\s+life
    - autocatalytic
    - autocatalysis

keywords:
  # Loosened 2026-05-09: dropped narrow AND-conditions where the OR-set is
  # already domain-specific; broadened AND context for queries with greedy
  # keywords (DFT, redox, MLIP). Goal is hundreds of papers per topic over
  # 2 years; relevance_filter (46 direct + 24 method + 23 domain patterns)
  # does the precision pass.

  "CO2 Reduction and Formate":
    filters:
      - "CO2 electroreduction"
      - "carbon dioxide reduction"
      - "carbon dioxide electroreduction"
      - "formate electrocatalysis"
      - "formate production"
      - "CO2RR"
      - 'RAW:("CO2 reduction" OR CO2RR OR "formate selectivity") AND (electrochem OR electrocatalysis OR electrode OR catalyst OR sulfide OR mineral OR DFT OR "ab initio" OR thermodynamic OR kinetic OR Faradaic OR HER)'

  "Sulfide Electrocatalysts":
    filters:
      - "transition metal sulfide"
      - "iron sulfide"
      - "nickel sulfide"
      - "metal sulfide"
      - "metal chalcogenide"
      - mackinawite
      - pentlandite
      - greigite
      - violarite
      - pyrite
      - pyrrhotite
      - millerite
      - chalcopyrite
      - "Fe-Ni-S"

  "Electrochemical Interfaces and Solvation":
    filters:
      - "electrochemical interface"
      - "electric double layer"
      - "electrified interface"
      - "constant potential DFT"
      - "grand canonical DFT"
      - "implicit solvation"
      - "explicit solvation"
      - "continuum solvation"
      - "polarizable continuum"
      # ENVIRON the Quantum-ESPRESSO solvation module — needs disambiguation
      # because bare "ENVIRON" matches "environment(s)" → cs.RO/cs.CV/cs.AI noise.
      # JDFTx is unique enough (only ~2 hits/year) but kept under RAW for safety.
      - 'RAW:ENVIRON AND (solvation OR DFT OR "Quantum-ESPRESSO" OR Andreussi OR pseudopotential OR electrochem OR PBC)'
      - 'RAW:JDFTx AND (DFT OR electrochem OR solvation OR "joint density functional theory" OR Sundararaman)'
      - "potential of zero charge"
      - "Helmholtz layer"

  "Ion Transport, Gradients, and Membranes":
    filters:
      - "pH gradient"
      - "proton transport"
      - "proton diffusion"
      - "hydroxide transport"
      - "ion transport"
      - "ionic conduction"
      - "Grotthuss mechanism"
      - "Grotthuss"
      - "membrane reactor"
      - "electrochemical membrane"
      - "flow cell"
      - "electrochemical impedance"

  "Redox and Autocatalytic Electrochemical Networks":
    filters:
      - "autocatalytic"
      - "autocatalysis"
      - "dissipative system"
      - "reaction network"
      - "chemical reaction network"
      - "redox cycle"
      - "redox cycling"
      - 'RAW:(redox OR Faradaic OR "electron transfer") AND (electrochem OR catalyst OR catalysis OR molecular OR mineral OR sulfide OR network OR autocatalytic OR dissipative OR "reaction network")'

  # === Topical buckets added 2026-05-08 (merged from sulfide-materials + geochem expansion) ===

  "Mineral Surfaces and Geochemistry":
    filters:
      - "mineral surface"
      - "mineral-water interface"
      - "rock-water interface"
      - "hydrothermal alteration"
      - "hydrothermal fluid"
      - "hydrothermal system"
      - "silicate weathering"
      - "mineral weathering"
      - "mineral dissolution"
      - "dissolution kinetics"
      - "serpentinization"
      - "biogeochemistry"
      - "marine chemistry"
      - "ocean acidification"
      - "ore deposit"
      - "ore mineral"
      - "carbonate-silicate cycle"

  "Atomistic Modeling of Sulfides and Minerals":
    filters:
      - "DFT sulfide"
      - "DFT mineral"
      - "DFT+U"
      - "AIMD"
      - "ab initio molecular dynamics"
      - "Car-Parrinello"
      - "nudged elastic band"
      - "transition state theory"
      - 'RAW:("density functional theory" OR DFT OR "ab initio" OR "molecular dynamics" OR NEB OR "metadynamics") AND (sulfide OR chalcogenide OR mineral OR oxide OR mackinawite OR pentlandite OR greigite OR pyrite OR pyrrhotite OR "metal surface" OR adsorption OR catalyst OR electrode OR vacancy OR defect)'

  "Machine-Learned Potentials for Sulfides and Minerals":
    filters:
      - "MACE"
      - "CHGNet"
      - "M3GNet"
      - "MACE-MP"
      - "neural network potential"
      - "active learning potential"
      - "GAP potential"
      - "ACE potential"
      - "equivariant potential"
      - "foundation model interatomic"
      - 'RAW:("machine learning potential" OR "machine-learned potential" OR "interatomic potential" OR MLIP OR "neural network potential") AND (sulfide OR chalcogenide OR mineral OR oxide OR "metal surface" OR catalyst OR electrochem)'

  "Sulfidation, Phase Stability, and Corrosion":
    filters:
      - sulfidation
      - "sulfide corrosion"
      - "sulfide passivation"
      - "phase stability sulfide"
      - "sulfide phase transition"
      - "surface oxidation sulfide"
      - "defect formation sulfide"
      - "sulfide thermodynamics"
      - 'RAW:(sulfidation OR corrosion OR passivation OR "surface oxidation" OR "phase stability" OR "phase transition" OR "defect formation" OR "thermodynamic stability" OR "formation energy") AND (sulfide OR chalcogenide OR mineral OR oxide OR mackinawite OR pentlandite OR pyrite OR pyrrhotite OR greigite)'

  "Aqueous Chemistry and Solvation":
    filters:
      - "solvation free energy"
      - "hydration free energy"
      - "hydration shell"
      - "first hydration shell"
      - "ion-water interaction"
      - "ion-water interactions"
      - "ion pairing"
      - "ion pair"
      - "electrolyte structure"
      - "polarizable water"
      - "polarizable force field"
      - "AMOEBA water"
      - "concentrated electrolyte"
      - "Stern layer"
      - "water structure"

  "Origin of Life and Prebiotic Mineral Catalysis":
    filters:
      - "origin of life"
      - "origins of life"
      - "prebiotic chemistry"
      - "prebiotic synthesis"
      - "abiotic carbon fixation"
      - "alkaline hydrothermal vent"
      - "alkaline vent"
      - "Lost City"
      - "FeMoco"
      - "Wood-Ljungdahl"
      - "iron-sulfur cluster"
      - "iron-sulfur world"
      - "[4Fe-4S]"
      - "[2Fe-2S]"
      - "Fe4S4"
      - "rTCA"
      - "reverse TCA"
      - "RNA world"
      - "ribozyme"
      - "mineral catalysis"
      - "autocatalytic network"
      - "serpentinization"
      - "primordial soup"
      - "abiogenesis"
