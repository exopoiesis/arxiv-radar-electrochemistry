# Author whitelist for arxiv-radar-electrochemistry.
#
# Mechanism: after the regex relevance_filter rejects a paper, daily_arxiv
# does a second-chance check against this whitelist. If any author of the
# paper matches, the paper is admitted with topic `via:author-whitelist:<note>`
# so its origin is traceable.
#
# Inclusion criteria: high-signal authors in electrochemistry, mineral
# surface DFT, prebiotic mineral catalysis, atomistic MD/MLIPs, and
# origin-of-life. Project-relevant first, then broader field leaders so
# the radar stays useful as a community contribution (not just our lens).
#
# Match is case-insensitive substring on each name in the paper's authors
# list. Use the most distinctive form of the surname; add forename initials
# only when the surname is ambiguous (e.g. "Russell, M." vs "Russell, J.").

authors:

  # --- DFT methodology, electrochemistry ---

  - name_match: ["Sundararaman", "R. Sundararaman", "Ravishankar Sundararaman"]
    affiliation_hint: ["Rensselaer", "RPI"]
    note: "JDFTx, electrochemistry-DFT, solvation"

  - name_match: ["Andreussi", "Oliviero Andreussi"]
    note: "ENVIRON, Quantum-ESPRESSO solvation"

  - name_match: ["Reuter, K", "Karsten Reuter"]
    note: "catalysis DFT, kinetic Monte Carlo"

  - name_match: ["Sprik", "Michiel Sprik"]
    note: "AIMD electrochemistry, redox levels"

  - name_match: ["Hammer, B", "Bjørk Hammer"]
    note: "DFT catalysis, GPAW"

  - name_match: ["Nørskov", "Jens Nørskov", "Norskov"]
    note: "scaling relations, electrocatalysis"

  - name_match: ["Janik", "Michael Janik"]
    note: "electrocatalysis DFT"

  - name_match: ["Goddard, W"]
    note: "ReaxFF, electrochemistry, CO2RR"

  # --- Sulfide / mineral surface DFT ---

  - name_match: ["Roldan", "Alberto Roldan"]
    note: "iron sulfide, mineral surfaces"

  - name_match: ["Santos-Carballal", "Santos Carballal"]
    note: "sulfide DFT, magnetism"

  - name_match: ["de Leeuw, N", "Nora de Leeuw"]
    note: "mineral surface DFT, hydrothermal chemistry"

  - name_match: ["Stirling, A", "Andras Stirling"]
    note: "iron sulfide AIMD"

  # --- Atomistic / proton dynamics / aqueous chem-physics ---

  - name_match: ["Marx, D", "Dominik Marx"]
    note: "AIMD, proton transfer"

  - name_match: ["Parrinello", "Michele Parrinello"]
    note: "metadynamics, AIMD"

  - name_match: ["Ceriotti", "Michele Ceriotti"]
    note: "PIMD, MLIPs, water"

  - name_match: ["Markland", "Tom Markland", "Thomas Markland"]
    note: "AIMD, proton transfer in water"

  - name_match: ["Tuckerman", "Mark Tuckerman"]
    note: "Grotthuss mechanism, AIMD"

  - name_match: ["Galli, G", "Giulia Galli"]
