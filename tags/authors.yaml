  - name_match: ["Batatia", "Ilyes Batatia"]
    note: "MACE author"

  - name_match: ["Ong, S", "Shyue Ping Ong"]
    note: "M3GNet, CHGNet"

  - name_match: ["Cheng, B", "Bingqing Cheng"]
    note: "MLIPs, water, free energy"

  - name_match: ["Tkatchenko", "Alexandre Tkatchenko"]
    note: "vdW, ML force fields"

  - name_match: ["Drautz", "Ralf Drautz"]
